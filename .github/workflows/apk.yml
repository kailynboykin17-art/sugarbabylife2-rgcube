name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get SDL2
        run: git clone --depth 1 -b release-2.30.9 https://github.com/libsdl-org/SDL.git deps/SDL2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SugarbabyLife2-RGCube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SugarbabyLife2-RGCube-APK
          path: SugarbabyLife2-RGCube.apk
